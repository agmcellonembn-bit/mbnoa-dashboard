<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Integrated Dashboard of MBN OA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0F12;
    --panel:#12181C;
    --panel-2:#161D22;
    --line:#232B30;
    --text:#E8EDEE;
    --muted:#8A979C;
    --accent:#6EE7B7;
    --accent-dim:#2E5B4C;
    --warn:#F5A623;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-dim); color:var(--accent); }

  /* ================= LANDING (drill-down nav) ================= */
  #landing{ max-width:960px; margin:56px auto; padding:0 20px 60px; }
  .title-bar{
    display:block; width:100%; background:#1230D8; border:3px solid #0B1F8C;
    color:#FFFFFF; font-family:'Inter',sans-serif; font-weight:700; font-size:20px;
    text-transform:uppercase; letter-spacing:.03em; text-align:center;
    padding:16px 20px; cursor:pointer; border-radius:0;
  }
  .title-bar:hover{ filter:brightness(1.08); }
  .title-bar:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .category-row{
    display:none; border:3px solid #0B1F8C; border-top:none;
  }
  .category-row.open{ display:flex; }
  .category-btn{
    all:unset; box-sizing:border-box; flex:1; min-width:0; padding:24px 10px; text-align:center;
    color:#FFFFFF; font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    border-right:2px solid rgba(0,0,0,.28); cursor:pointer; word-break:break-word;
  }
  .category-btn:last-child{ border-right:none; }
  .category-btn:hover{ filter:brightness(1.1); }
  .category-btn.active{ box-shadow:inset 0 0 0 3px rgba(255,255,255,.85); }
  .category-btn:focus-visible{ outline:2px solid #fff; outline-offset:-4px; }

  .category-panel{
    display:none; border:3px solid #0B1F8C; border-top:none; background:#0B0B0B;
  }
  .category-panel.open{ display:block; }
  .table-list{ list-style:none; margin:0; padding:0; }
  .table-list li{ border-bottom:1px solid rgba(255,255,255,.15); }
  .table-list li:last-child{ border-bottom:none; }
  .table-list li button{
    all:unset; cursor:pointer; display:block; width:100%; box-sizing:border-box;
    padding:13px 18px; color:#FFFFFF; font-family:'Inter',sans-serif; font-size:14.5px;
  }
  .table-list li button:hover{ background:rgba(255,255,255,.08); color:#CFE8FB; }
  .category-panel .empty-msg, .category-panel .loading-msg, .category-panel .error-msg{
    padding:16px 18px; color:var(--muted); font-size:13.5px; font-family:'Inter',sans-serif;
  }
  .category-panel .error-msg{ color:#FF8A80; }

  @media (max-width: 640px){
    .category-row{ flex-direction:column; }
    .category-btn{ border-right:none; border-bottom:2px solid rgba(0,0,0,.28); }
    .category-btn:last-child{ border-bottom:none; }
  }

  /* ================= FOCUSED TABLE VIEW ================= */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(11,15,18,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 18px;
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .back-link{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
    text-decoration:none; letter-spacing:.05em;
  }
  .back-link:hover{ color:var(--accent); }
  .brand .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;
  }
  h1{
    font-family:'Sora',sans-serif; font-weight:800; font-size:20px; margin:0;
    letter-spacing:-0.01em;
  }
  .sync-status{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);
  }
  .pulse-dot{
    width:8px; height:8px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 0 rgba(110,231,183,.6);
    flex:none;
  }
  .pulse-dot.live{ animation:pulse 1.6s ease-out infinite; }
  .pulse-dot.error{ background:var(--warn); }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(110,231,183,.55); }
    70%{ box-shadow:0 0 0 9px rgba(110,231,183,0); }
    100%{ box-shadow:0 0 0 0 rgba(110,231,183,0); }
  }
  @media (prefers-reduced-motion: reduce){
    .pulse-dot.live{ animation:none; }
  }

  .controls{
    display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap;
  }
  .search-wrap{ position:relative; flex:1 1 220px; min-width:160px; }
  .search-wrap input{
    width:100%; background:var(--panel); border:1px solid var(--line);
    color:var(--text); border-radius:var(--radius); padding:9px 12px 9px 30px;
    font-family:'Inter',sans-serif; font-size:13.5px; outline:none;
  }
  .search-wrap input:focus{ border-color:var(--accent); }
  .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55; }

  button.btn{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:var(--radius); padding:9px 14px; font-size:13px; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:border-color .15s ease, color .15s ease;
  }
  button.btn:hover{ border-color:var(--accent); color:var(--accent); }
  button.btn:focus-visible, input:focus-visible, th button:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  button.btn.primary{ background:var(--accent); color:#062017; border-color:var(--accent); }
  button.btn.primary:hover{ color:#062017; opacity:.9; }
  .icon-spin{ animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  main{ padding:18px; max-width:1400px; margin:0 auto; }

  .meta-row{
    display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);
  }
  .meta-row b{ color:var(--text); font-weight:600; }

  .state-box{
    border:1px dashed var(--line); border-radius:var(--radius);
    padding:40px 20px; text-align:center; color:var(--muted);
    font-size:13.5px;
  }
  .state-box.error{ border-color:var(--warn); color:var(--warn); }

  .table-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap; margin-bottom:10px;
  }
  .updated-label{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); }
  .updated-label b{ color:var(--accent); font-weight:600; }
  .toolbar-actions{ display:flex; gap:8px; }
  button.btn.small{ padding:7px 12px; font-size:12px; }

  /* ---------- Table (desktop) — light blue bordered style ---------- */
  .table-wrap{
    background:#CFE8FB; border:1px solid #0B3A5C; border-radius:0;
    overflow:auto;
  }
  table{ width:100%; border-collapse:collapse; font-size:15px; table-layout:auto; }
  #titleCell{
    text-align:center; padding:16px 12px; border:1px solid #0B3A5C;
    font-family:'Inter',sans-serif; font-weight:600; font-size:22px;
    color:#06263D; text-transform:uppercase; letter-spacing:.02em;
    background:#B7DBF7;
  }
  thead th{
    position:sticky; top:0; background:#B7DBF7;
    text-align:center; padding:0; border:1px solid #0B3A5C;
    font-family:'Inter',sans-serif; font-size:16px; font-weight:600;
    color:#06263D; text-transform:none;
    white-space:normal; word-break:normal; overflow-wrap:break-word;
    vertical-align:middle;
  }
  thead th button{
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:12px 8px; width:100%; box-sizing:border-box; line-height:1.25; color:#06263D;
  }
  thead th button:hover{ color:#0B4C8C; }
  thead th .arrow{ font-size:11px; opacity:.7; flex:none; }
  tbody td{
    padding:10px 16px; border:1px solid #0B3A5C;
    color:#0B1F2E; font-variant-numeric:tabular-nums;
    text-align:left; font-weight:400;
    white-space:pre-line; overflow-wrap:break-word;
  }
  tbody tr:hover{ background:#BEE0FA; }
  td.metric-good{ background:#1B5E20 !important; color:#FFFFFF; font-weight:700; }
  td.metric-bad{ background:#B71C1C !important; color:#FFFFFF; font-weight:700; }

  .flash{ animation:flashcell 1.4s ease; }
  @keyframes flashcell{
    0%{ background:rgba(255,215,0,.55); }
    100%{ background:transparent; }
  }

  /* ---------- Mobile cards ---------- */
  .cards{ display:none; flex-direction:column; gap:10px; }
  .card{
    background:#CFE8FB; border:1px solid #0B3A5C;
    border-radius:0; padding:12px 14px;
  }
  .card .field{
    display:flex; justify-content:space-between; gap:10px; padding:5px 4px;
    border-bottom:1px solid #0B3A5C; font-size:13px; color:#0B1F2E;
  }
  .card .field:last-child{ border-bottom:none; }
  .card .field .k{ color:#0B4C8C; font-family:'Inter',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .card .field .v{ text-align:right; font-weight:500; color:#0B1F2E; white-space:pre-line; }
  .card .field.metric-good{ background:#1B5E20; border-radius:6px; }
  .card .field.metric-good .k, .card .field.metric-good .v{ color:#FFFFFF; font-weight:700; }
  .card .field.metric-bad{ background:#B71C1C; border-radius:6px; }
  .card .field.metric-bad .k, .card .field.metric-bad .v{ color:#FFFFFF; font-weight:700; }

  @media (max-width: 720px){
    h1{ font-size:17px; }
    main{ padding:12px; }
    .table-wrap{ display:none; }
    .cards{ display:flex; }
  }
</style>
</head>
<body>

<!-- ================= LANDING PAGE ================= -->
<div id="landing">
  <button type="button" class="title-bar" id="titleBar">INTEGRATED DASHBOARD OF MBN OA</button>
  <div class="category-row" id="categoryRow"></div>
  <div class="category-panel" id="categoryPanel"></div>
</div>

<!-- ================= FOCUSED SINGLE-TABLE VIEW ================= -->
<div id="focusedView" style="display:none;">
  <header>
    <div class="header-row">
      <div class="brand">
        <div>
          <div class="eyebrow"><a class="back-link" href="./index.html">← All dashboards</a> · Live · Google Sheet</div>
          <h1 id="sheetTitle">Table</h1>
        </div>
      </div>
      <div class="sync-status">
        <span class="pulse-dot" id="pulseDot"></span>
        <span id="syncLabel">connecting…</span>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Filter rows…" autocomplete="off">
      </div>
      <button class="btn primary" id="refreshBtn">↻ Refresh</button>
      <button class="btn" id="autoBtn">Auto: Off</button>
    </div>
  </header>

  <main>
    <div class="meta-row">
      <span>Rows: <b id="rowCount">–</b></span>
      <span>Last synced: <b id="lastSynced">–</b></span>
      <span>Next refresh: <b id="nextRefresh">–</b></span>
    </div>

    <div id="stateBox" class="state-box">Loading data…</div>

    <div class="table-toolbar" id="tableToolbar" style="display:none;">
      <span class="updated-label" id="updatedLabel">–</span>
      <div class="toolbar-actions">
        <button class="btn small" id="exportCsvBtn">⬇ CSV</button>
        <button class="btn small" id="exportXlsxBtn">⬇ Excel</button>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap" style="display:none;">
      <table id="dataTable">
        <thead>
          <tr id="titleRow"><th id="titleCell"></th></tr>
          <tr id="headRow"></tr>
        </thead>
        <tbody id="bodyRows"></tbody>
      </table>
    </div>

    <div class="cards" id="cardsWrap"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================================================
   CONFIG
   1. Open your Google Sheet → File → Share → "Anyone with the
      link" set to Viewer (no need to "publish to web").
   2. Copy the Sheet ID from the URL:
      docs.google.com/spreadsheets/d/<SHEET_ID>/edit#gid=<GID>
   3. Paste SHEET_ID below. CATEGORIES lists each top-level button
      shown on the landing page — "name" MUST exactly match a real
      tab name in your Google Sheet (case/spacing matters), and
      "color" is that button's background color.

   Each tab can hold MULTIPLE tables — a table is auto-detected as
   an optional short title row, followed by a header row (≥4 filled
   cells), followed by its data rows, ending at a blank row or the
   start of the next table. Clicking a category on the landing page
   re-scans that tab and lists every table found on it. Clicking a
   table opens it in a new window/tab as its own live mini-dashboard
   (search, sort, refresh, auto-refresh, CSV/Excel export all work
   there, scoped to just that one table).
   ============================================================ */
const CONFIG = {
  SHEET_ID: "1R6cRutGOC_CQTbCwetZYEYnfwmbedCAwcevORYCxz8M",
  TITLE: "INTEGRATED DASHBOARD OF MBN OA",
  AUTO_REFRESH_SECONDS: 60,
  API_KEY: "AIzaSyAVrhHs2xiCl2kF1_IujMxHZDk6tNmsjY4", // from Google Cloud Console, with the "Google Sheets API" enabled
  CATEGORIES: [
    { name: "CFA",          color: "#2E9E7C" },
    { name: "CM",           color: "#17C4E6" },
    { name: "EB/LC",        color: "#FF7A1A" },
    { name: "FINANCE",      color: "#FF22FF" },
    { name: "OVER ALL NWA", color: "#7A1E78" }
  ]
};

/* ---------------- Shared sheet-fetching + table-detection ---------------- */

/* Fetches one tab via the Google Sheets API (not the plain CSV export) so
   we get back the EXACT merged-cell ranges alongside the values — no more
   guessing which columns are grouped from blank-cell patterns. Requires
   CONFIG.API_KEY with the Sheets API enabled, and the sheet still shared
   as "Anyone with the link → Viewer" (a plain API key only works for
   public/link-shared sheets, not private ones). */
function buildSheetApiUrl(sheetName){
  const fields = 'sheets(data(rowData(values(formattedValue))),merges)';
  return `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}` +
    `?ranges=${encodeURIComponent(sheetName)}&includeGridData=true` +
    `&fields=${encodeURIComponent(fields)}&key=${encodeURIComponent(CONFIG.API_KEY)}`;
}

function fetchSheetGrid(sheetName){
  if(!CONFIG.API_KEY || CONFIG.API_KEY.indexOf('PASTE_YOUR') === 0){
    return Promise.reject(new Error('No Google API key set — paste one into CONFIG.API_KEY near the top of the script.'));
  }
  return fetch(buildSheetApiUrl(sheetName), { cache: 'no-store' })
    .then(res => res.json().then(json => ({ ok: res.ok, status: res.status, json })))
    .then(({ ok, status, json }) => {
      if(!ok){
        const apiMsg = json && json.error && json.error.message;
        throw new Error(apiMsg ? `Sheets API: ${apiMsg}` : `HTTP ${status} loading "${sheetName}" tab`);
      }
      const sheetObj = (json.sheets && json.sheets[0]) || {};
      const dataBlock = (sheetObj.data && sheetObj.data[0]) || {};
      const rowDataArr = dataBlock.rowData || [];
      const rawRows = rowDataArr.map(rd =>
        (rd.values || []).map(v => (v && v.formattedValue !== undefined) ? v.formattedValue : '')
      );
      const mergesRaw = sheetObj.merges || [];
      const width = Math.max(
        0,
        ...rawRows.map(r => r.length),
        ...mergesRaw.map(m => m.endColumnIndex || 0)
      );
      const rows = rawRows.map(r => {
        const copy = r.slice();
        while(copy.length < width) copy.push('');
        return copy;
      });
      const merges = mergesRaw.map(m => ({
        startRowIndex: m.startRowIndex || 0,
        endRowIndex: m.endRowIndex,
        startColumnIndex: m.startColumnIndex || 0,
        endColumnIndex: m.endColumnIndex
      }));
      return { rows, merges, lastModified: null };
    });
}

function isRowBlank(row){
  return !row || row.every(c => String(c || '').trim() === '');
}
function nonEmptyCount(row){
  return row.filter(c => String(c || '').trim() !== '').length;
}

/* Splits a raw grid of rows into separate tables — without requiring a
   blank row between them — using the sheet's ACTUAL merged-cell ranges
   (from the Sheets API) to build compound headers exactly, rather than
   guessing group boundaries from blank-cell patterns. A new table starts
   wherever we see either a blank row then a header row (optionally
   preceded by a short title row), or a short title row immediately
   followed by a wider header row with no blank line between them. */
function detectTables(rows, merges){
  const found = [];
  let i = 0;
  const n = rows.length;

  function mergesStartingAtRow(rowIdx){
    return merges.filter(m => m.startRowIndex === rowIdx);
  }

  function looksLikeTitleThenHeader(idx){
    const titleCount = nonEmptyCount(rows[idx]);
    if(titleCount < 1 || titleCount > 2) return false;
    let headerIdx = idx + 1;
    if(headerIdx < n && isRowBlank(rows[headerIdx])) headerIdx++; // allow one blank line between title and header
    if(headerIdx >= n || isRowBlank(rows[headerIdx])) return false;
    const headerCount = nonEmptyCount(rows[headerIdx]);
    return headerCount >= 2 && headerCount > titleCount;
  }

  while(i < n){
    while(i < n && isRowBlank(rows[i])) i++;
    if(i >= n) break;

    let label = null;
    if(looksLikeTitleThenHeader(i)){
      label = (rows[i].find(c => String(c || '').trim() !== '') || '').toString().trim();
      i++;
      if(i < n && isRowBlank(rows[i])) i++; // skip the blank line between title and header, if present
    }
    if(i >= n) break;

    const groupRowIdx = i;
    const width = rows[groupRowIdx].length;

    // Merges that START on the group-header row, mapped per column. A
    // merge spanning down into the row below (endRowIndex > groupRowIdx+1)
    // means that column's single label spans both header rows (like
    // "SDCA"). A merge confined to this one row but spanning several
    // columns (e.g. "Sep-2026 Targets") means those columns share a group
    // label and expect a real sub-label per column in the row beneath.
    const rowMergesHere = mergesStartingAtRow(groupRowIdx).filter(m => m.startColumnIndex < width);
    const mergeForCol = new Array(width).fill(null);
    rowMergesHere.forEach(m => {
      for(let c = m.startColumnIndex; c < Math.min(m.endColumnIndex, width); c++) mergeForCol[c] = m;
    });

    const anyHorizontalOnlyMerges = rowMergesHere.filter(m =>
      (m.endRowIndex - m.startRowIndex) === 1 && (m.endColumnIndex - m.startColumnIndex) > 1
    );
    const subRowIdx = groupRowIdx + 1;
    let usesSubHeader = false;
    if(anyHorizontalOnlyMerges.length > 0 && subRowIdx < n && !isRowBlank(rows[subRowIdx])){
      // Only check the columns that actually need a sub-label (the ones
      // inside a horizontal-only merge) — and require the row below to
      // hold non-numeric text there, not numbers, so a genuine first data
      // row doesn't get mistaken for a sub-header row.
      let totalCols = 0, textCols = 0;
      anyHorizontalOnlyMerges.forEach(m => {
        for(let c = m.startColumnIndex; c < Math.min(m.endColumnIndex, width); c++){
          totalCols++;
          const val = String(rows[subRowIdx][c] || '').trim();
          if(val !== '' && !isNumeric(val)) textCols++;
        }
      });
      usesSubHeader = totalCols > 0 && textCols >= Math.ceil(totalCols * 0.6);
    }

    const clusters = [];
    let col = 0;
    while(col < width){
      const m = mergeForCol[col];
      if(m){
        const span = Math.min(m.endColumnIndex, width) - m.startColumnIndex;
        const spansIntoRowBelow = (m.endRowIndex - m.startRowIndex) > 1;
        const label = String(rows[groupRowIdx][m.startColumnIndex] || '').trim() || `Group ${clusters.length + 1}`;
        if(!spansIntoRowBelow && usesSubHeader){
          clusters.push({ start: col, span, sub: true, label });
        } else {
          clusters.push({ start: col, span, sub: false, label });
        }
        col += span;
      } else {
        const raw = String(rows[groupRowIdx][col] || '').trim();
        const label = raw || `Column ${col + 1}`;
        // A plain, un-merged column only needs a sub-label if the row
        // below genuinely has text there for it — otherwise it's a
        // standalone column that just happens to sit beside a compound
        // header, and should span both header rows on its own.
        const subVal = usesSubHeader ? String(rows[subRowIdx][col] || '').trim() : '';
        clusters.push({ start: col, span: 1, sub: !!subVal, label });
        col += 1;
      }
    }

    i = usesSubHeader ? subRowIdx + 1 : groupRowIdx + 1;

    const seenKeyCounts = {};
    function keyFor(base){
      seenKeyCounts[base] = (seenKeyCounts[base] || 0) + 1;
      return seenKeyCounts[base] > 1 ? `${base} (${seenKeyCounts[base]})` : base;
    }
    const header = [];
    clusters.forEach(c => {
      if(c.sub){
        for(let k = 0; k < c.span; k++){
          const subText = String(rows[subRowIdx][c.start + k] || '').trim();
          header.push(keyFor(subText ? `${c.label} - ${subText}` : c.label));
        }
      } else {
        for(let k = 0; k < c.span; k++){
          header.push(keyFor(c.label));
        }
      }
    });

    const headerGroups = usesSubHeader
      ? clusters.map(c => c.sub
          ? { label: c.label, span: c.span, sub: true,
              subLabels: Array.from({ length: c.span }, (_, k) => String(rows[subRowIdx][c.start + k] || '').trim()) }
          : { label: c.label, span: c.span, sub: false })
      : null;

    const dataRows = [];
    while(i < n){
      if(isRowBlank(rows[i])){ i++; break; }
      if(header.length >= 2 && looksLikeTitleThenHeader(i)) break;
      if(nonEmptyCount(rows[i]) > 0) dataRows.push(rows[i]);
      i++;
    }

    found.push({ label: label || `Table ${found.length + 1}`, header, headerGroups, rows: dataRows });
  }

  return found
    .filter(t => !(t.rows.length === 0 && t.header.filter(h => !h.startsWith('Column ')).length <= 1))
    .map(t => {
      // Skip column-pruning for compound-header tables — their column
      // count is already exact, straight from real merge data.
      if(t.headerGroups) return t;
      const pruned = pruneEmptyColumns(t.header, t.rows);
      return { label: t.label, header: pruned.header, headerGroups: null, rows: pruned.rows };
    });
}

function pruneEmptyColumns(header, dataRows){
  const width = header.length;
  const hasContent = new Array(width).fill(false);
  header.forEach((h, i) => { if(!/^Column \d+$/.test(h)) hasContent[i] = true; });
  dataRows.forEach(row => {
    for(let i = 0; i < width; i++){
      if(String(row[i] || '').trim() !== '') hasContent[i] = true;
    }
  });
  const keep = [];
  for(let i = 0; i < width; i++) if(hasContent[i]) keep.push(i);
  return {
    header: keep.map(i => header[i]),
    rows: dataRows.map(row => keep.map(i => row[i]))
  };
}

function rowsToObjects(header, dataRows){
  return dataRows.map(r => {
    const obj = {};
    header.forEach((h, i) => obj[h] = r[i] !== undefined ? r[i] : '');
    return obj;
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function isNumeric(v){
  if(v===''||v===null||v===undefined) return false;
  return !isNaN(parseNumber(v));
}
function parseNumber(v){
  if(v===''||v===null||v===undefined) return NaN;
  const cleaned = String(v).replace(/[,%\s]/g,'').trim();
  if(cleaned==='') return NaN;
  return parseFloat(cleaned);
}

/* Conditional cell-coloring rules. Each rule matches cells by column name
   (columnMatch: case-insensitive substring) and returns a CSS class name
   ('metric-good' = dark green, 'metric-bad' = red) for a given cell value,
   or null to leave it uncolored. Empty by default — add rules here to
   color specific columns by whatever thresholds matter to you. */
const CONDITIONAL_RULES = [
  // Example:
  // { columnMatch: "AVAIL", classify: v => (isNumeric(v) && parseNumber(v) < 98) ? 'metric-bad' : 'metric-good' }
];

function classifyCell(colName, value){
  for(const rule of CONDITIONAL_RULES){
    if(rule.columnMatch && !String(colName).toUpperCase().includes(rule.columnMatch.toUpperCase())) continue;
    const cls = rule.classify(value);
    if(cls) return cls;
  }
  return null;
}

/* ============================================================
   LANDING PAGE — title bar → colored category buttons → dropdown
   list of tables detected in that tab → opens table in new window
   ============================================================ */

const landingEl = {
  landing: document.getElementById('landing'),
  titleBar: document.getElementById('titleBar'),
  categoryRow: document.getElementById('categoryRow'),
  categoryPanel: document.getElementById('categoryPanel'),
};

let activeCategoryName = null;

function buildCategoryRow(){
  landingEl.categoryRow.innerHTML = '';
  CONFIG.CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'category-btn';
    btn.style.background = cat.color;
    btn.textContent = cat.name;
    btn.dataset.name = cat.name;
    btn.addEventListener('click', () => selectCategory(cat));
    landingEl.categoryRow.appendChild(btn);
  });
}
buildCategoryRow();
landingEl.titleBar.textContent = CONFIG.TITLE;

landingEl.titleBar.addEventListener('click', () => {
  const nowOpen = !landingEl.categoryRow.classList.contains('open');
  landingEl.categoryRow.classList.toggle('open', nowOpen);
  if(!nowOpen){
    closeCategoryPanel();
  }
});

function closeCategoryPanel(){
  landingEl.categoryPanel.classList.remove('open');
  landingEl.categoryPanel.innerHTML = '';
  activeCategoryName = null;
  [...landingEl.categoryRow.children].forEach(b => b.classList.remove('active'));
}

function setActiveCategoryButton(name){
  [...landingEl.categoryRow.children].forEach(b => {
    b.classList.toggle('active', b.dataset.name === name);
  });
}

function selectCategory(cat){
  if(activeCategoryName === cat.name){
    closeCategoryPanel();
    return;
  }
  activeCategoryName = cat.name;
  setActiveCategoryButton(cat.name);
  landingEl.categoryPanel.classList.add('open');
  landingEl.categoryPanel.innerHTML = `<div class="loading-msg">Loading tables from "${escapeHtml(cat.name)}"…</div>`;

  fetchSheetGrid(cat.name)
    .then(({ rows: grid, merges }) => {
      if(activeCategoryName !== cat.name) return; // user switched categories while this was loading
      const tables = detectTables(grid, merges);
      if(tables.length === 0){
        landingEl.categoryPanel.innerHTML = `<div class="empty-msg">No tables found in the "${escapeHtml(cat.name)}" tab yet.</div>`;
        return;
      }
      const list = document.createElement('ul');
      list.className = 'table-list';
      tables.forEach(t => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = t.label;
        b.addEventListener('click', () => {
          const url = new URL(window.location.href);
          url.search = `tab=${encodeURIComponent(cat.name)}&table=${encodeURIComponent(t.label)}`;
          url.hash = '';
          window.open(url.toString(), '_blank', 'noopener');
        });
        li.appendChild(b);
        list.appendChild(li);
      });
      landingEl.categoryPanel.innerHTML = '';
      landingEl.categoryPanel.appendChild(list);
    })
    .catch(err => {
      if(activeCategoryName !== cat.name) return;
      landingEl.categoryPanel.innerHTML = `<div class="error-msg">Could not load the "${escapeHtml(cat.name)}" tab: ${escapeHtml(err.message || 'Unknown error')}</div>`;
    });
}

/* ============================================================
   FOCUSED VIEW — a single table, opened in its own window, with
   the full search/sort/refresh/auto-refresh/export dashboard.
   ============================================================ */

const params = new URLSearchParams(location.search);
const focusedTab = params.get('tab');
const focusedTable = params.get('table');
const isFocusedView = !!(focusedTab && focusedTable);

if(isFocusedView){
  document.getElementById('landing').style.display = 'none';
  document.getElementById('focusedView').style.display = 'block';
} else {
  document.getElementById('focusedView').style.display = 'none';
}

let columns = [];
let rows = [];
let headerGroups = null;
let sortState = { col: null, dir: 1 };
let autoTimer = null;
let countdownTimer = null;
let secondsLeft = 0;
let sheetLastModified = null;

const el = {
  title: document.getElementById('sheetTitle'),
  pulse: document.getElementById('pulseDot'),
  syncLabel: document.getElementById('syncLabel'),
  rowCount: document.getElementById('rowCount'),
  lastSynced: document.getElementById('lastSynced'),
  nextRefresh: document.getElementById('nextRefresh'),
  stateBox: document.getElementById('stateBox'),
  tableWrap: document.getElementById('tableWrap'),
  titleRow: document.getElementById('titleRow'),
  titleCell: document.getElementById('titleCell'),
  headRow: document.getElementById('headRow'),
  bodyRows: document.getElementById('bodyRows'),
  cardsWrap: document.getElementById('cardsWrap'),
  search: document.getElementById('searchInput'),
  refreshBtn: document.getElementById('refreshBtn'),
  autoBtn: document.getElementById('autoBtn'),
  tableToolbar: document.getElementById('tableToolbar'),
  updatedLabel: document.getElementById('updatedLabel'),
  exportCsvBtn: document.getElementById('exportCsvBtn'),
  exportXlsxBtn: document.getElementById('exportXlsxBtn'),
};

function fetchFocusedData(){
  el.pulse.classList.add('live');
  el.pulse.classList.remove('error');
  el.syncLabel.textContent = 'syncing…';
  el.refreshBtn.innerHTML = '<span class="icon-spin" style="display:inline-block;">↻</span> Refresh';

  fetchSheetGrid(focusedTab)
    .then(({ rows: grid, merges, lastModified }) => {
      sheetLastModified = lastModified ? new Date(lastModified) : null;
      const tables = detectTables(grid, merges);
      const match = tables.find(t => t.label === focusedTable) ||
                    tables.find(t => t.label.toUpperCase() === focusedTable.toUpperCase());
      if(!match){
        throw new Error(`Table "${focusedTable}" was not found in the "${focusedTab}" tab anymore — it may have been renamed, moved, or removed. Go back to the dashboard and reopen it.`);
      }
      columns = match.header;
      headerGroups = match.headerGroups || null;
      rows = rowsToObjects(match.header, match.rows);

      el.title.textContent = match.label;
      document.title = `${match.label} — ${CONFIG.TITLE}`;

      el.pulse.classList.remove('live','error');
      el.syncLabel.textContent = 'connected';
      el.lastSynced.textContent = new Date().toLocaleTimeString();
      el.rowCount.textContent = rows.length;

      renderAll();
      scheduleCountdown();
    })
    .catch(err => handleError(err));
}

function handleError(err){
  el.pulse.classList.remove('live');
  el.pulse.classList.add('error');
  el.syncLabel.textContent = 'error';
  el.refreshBtn.innerHTML = '↻ Refresh';
  el.stateBox.style.display = 'block';
  el.stateBox.classList.add('error');
  const reason = (err && (err.message || err.statusText)) ? (err.message || err.statusText) : 'Unknown error';
  const isFileProtocol = location.protocol === 'file:';
  el.stateBox.innerHTML =
    `Could not load the table.<br>` +
    `<span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;opacity:.85;">Reason: ${escapeHtml(reason)}</span><br><br>` +
    (isFileProtocol
      ? `You're opening this file directly (file://). Google often blocks that. Host it (GitHub Pages / Netlify / Cloudflare Pages) and open the https:// link instead.`
      : `Double-check CONFIG.SHEET_ID and that the sheet is shared as "Anyone with the link → Viewer".`);
  el.tableWrap.style.display = 'none';
  el.cardsWrap.innerHTML = '';
  console.error(err);
}

function applySort(data){
  if(sortState.col === null) return data;
  const col = columns[sortState.col];
  const numeric = data.every(r => isNumeric(r[col]) || r[col] === '');
  return [...data].sort((a,b)=>{
    let av = a[col], bv = b[col];
    if(numeric){ av = parseNumber(av)||0; bv = parseNumber(bv)||0; return (av-bv)*sortState.dir; }
    return String(av).localeCompare(String(bv)) * sortState.dir;
  });
}

function applyFilter(data){
  const q = el.search.value.trim().toLowerCase();
  if(!q) return data;
  return data.filter(r => columns.some(c => String(r[c]).toLowerCase().includes(q)));
}

function formatUpdatedLabel(){
  if(sheetLastModified){
    return `Sheet data last updated: <b>${sheetLastModified.toLocaleString()}</b>`;
  }
  return `Sheet's own update time isn't available — showing last check instead: <b>${el.lastSynced.textContent}</b>`;
}

function renderAll(){
  let view = applyFilter(rows);
  view = applySort(view);
  renderTable(view);
  renderCards(view);
  el.tableWrap.style.display = 'block';
  el.tableToolbar.style.display = 'flex';
  el.updatedLabel.innerHTML = formatUpdatedLabel();
  if(rows.length === 0){
    el.stateBox.style.display = 'block';
    el.stateBox.classList.remove('error');
    el.stateBox.textContent = `No data rows found in "${focusedTable}" yet — add rows in the sheet and hit Refresh.`;
  } else {
    el.stateBox.style.display = 'none';
  }
}

function currentViewRows(){
  return applySort(applyFilter(rows));
}

function safeFilename(){
  return String(focusedTable || 'export').replace(/[^a-z0-9\-_ ]/gi, '').trim().slice(0, 60) || 'export';
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCsv(){
  const view = currentViewRows();
  const csv = Papa.unparse({ fields: columns, data: view.map(r => columns.map(c => r[c])) });
  downloadBlob(csv, `${safeFilename()}.csv`, 'text/csv;charset=utf-8;');
}

function exportXlsx(){
  const view = currentViewRows();
  const wsData = [columns, ...view.map(r => columns.map(c => r[c]))];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, safeFilename().slice(0, 31) || 'Sheet1');
  XLSX.writeFile(wb, `${safeFilename()}.xlsx`);
}

function renderTable(view){
  el.titleCell.textContent = focusedTable;
  el.titleCell.colSpan = columns.length;

  const existingGroupRow = document.getElementById('groupHeadRow');
  if(existingGroupRow) existingGroupRow.remove();
  el.headRow.innerHTML = '';

  if(headerGroups){
    const groupRow = document.createElement('tr');
    groupRow.id = 'groupHeadRow';
    let leafIdx = 0;
    headerGroups.forEach(g => {
      const th = document.createElement('th');
      if(g.sub){
        th.colSpan = g.span;
        th.textContent = g.label;
      } else {
        th.rowSpan = 2;
        if(g.span > 1) th.colSpan = g.span;
        const btn = document.createElement('button');
        const globalIdx = leafIdx;
        const arrow = sortState.col === globalIdx ? (sortState.dir === 1 ? '▲' : '▼') : '';
        btn.innerHTML = `<span>${escapeHtml(g.label)}</span><span class="arrow">${arrow}</span>`;
        btn.addEventListener('click', ()=>{
          if(sortState.col === globalIdx){ sortState.dir *= -1; } else { sortState.col = globalIdx; sortState.dir = 1; }
          renderAll();
        });
        th.appendChild(btn);
      }
      groupRow.appendChild(th);
      leafIdx += g.span;
    });
    el.titleRow.insertAdjacentElement('afterend', groupRow);

    leafIdx = 0;
    headerGroups.forEach(g => {
      if(g.sub){
        g.subLabels.forEach(subLabel => {
          const th = document.createElement('th');
          const globalIdx = leafIdx;
          const btn = document.createElement('button');
          const arrow = sortState.col === globalIdx ? (sortState.dir === 1 ? '▲' : '▼') : '';
          btn.innerHTML = `<span>${escapeHtml(subLabel)}</span><span class="arrow">${arrow}</span>`;
          btn.addEventListener('click', ()=>{
            if(sortState.col === globalIdx){ sortState.dir *= -1; } else { sortState.col = globalIdx; sortState.dir = 1; }
            renderAll();
          });
          th.appendChild(btn);
          el.headRow.appendChild(th);
          leafIdx++;
        });
      } else {
        leafIdx++; // spanned from the group row above; no cell here
      }
    });
  } else {
    columns.forEach((c,i)=>{
      const th = document.createElement('th');
      const btn = document.createElement('button');
      const arrow = sortState.col === i ? (sortState.dir === 1 ? '▲' : '▼') : '';
      btn.innerHTML = `<span>${escapeHtml(c)}</span><span class="arrow">${arrow}</span>`;
      btn.addEventListener('click', ()=>{
        if(sortState.col === i){ sortState.dir *= -1; } else { sortState.col = i; sortState.dir = 1; }
        renderAll();
      });
      th.appendChild(btn);
      el.headRow.appendChild(th);
    });
  }

  el.bodyRows.innerHTML = '';
  view.forEach(r=>{
    const tr = document.createElement('tr');
    columns.forEach((c)=>{
      const td = document.createElement('td');
      const cellClass = classifyCell(c, r[c]);
      if(cellClass) td.classList.add(cellClass);
      td.textContent = r[c];
      tr.appendChild(td);
    });
    el.bodyRows.appendChild(tr);
  });
}

function renderCards(view){
  el.cardsWrap.innerHTML = '';
  view.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'card';
    columns.forEach((c)=>{
      const field = document.createElement('div');
      field.className = 'field';
      const fieldClass = classifyCell(c, r[c]);
      if(fieldClass) field.classList.add(fieldClass);
      field.innerHTML = `<span class="k">${escapeHtml(c)}</span><span class="v">${escapeHtml(String(r[c]))}</span>`;
      card.appendChild(field);
    });
    el.cardsWrap.appendChild(card);
  });
}

function scheduleCountdown(){
  clearInterval(countdownTimer);
  if(!autoTimer){ el.nextRefresh.textContent = '–'; return; }
  secondsLeft = CONFIG.AUTO_REFRESH_SECONDS;
  el.nextRefresh.textContent = secondsLeft + 's';
  countdownTimer = setInterval(()=>{
    secondsLeft--;
    el.nextRefresh.textContent = secondsLeft > 0 ? secondsLeft + 's' : '…';
    if(secondsLeft <= 0) clearInterval(countdownTimer);
  }, 1000);
}

el.search.addEventListener('input', renderAll);
el.refreshBtn.addEventListener('click', fetchFocusedData);
el.autoBtn.addEventListener('click', ()=>{
  if(autoTimer){
    clearInterval(autoTimer); autoTimer = null; clearInterval(countdownTimer);
    el.autoBtn.textContent = 'Auto: Off';
    el.nextRefresh.textContent = '–';
  } else {
    autoTimer = setInterval(fetchFocusedData, CONFIG.AUTO_REFRESH_SECONDS * 1000);
    el.autoBtn.textContent = 'Auto: On';
    scheduleCountdown();
  }
});
el.exportCsvBtn.addEventListener('click', exportCsv);
el.exportXlsxBtn.addEventListener('click', exportXlsx);

if(isFocusedView){
  fetchFocusedData();
}
</script>
</body>
</html>
